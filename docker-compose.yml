services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-clusterer-builder:
        condition: service_completed_successfully
    restart: always
    entrypoint: [ "bash", "-c", "until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done; bundle install && rails server -b 0.0.0.0" ]
    command: bash -c "bundle install && rails db:setup && rails server -b 0.0.0.0"
    networks:
      - palette-net

  image-clusterer-builder:
    build:
      context: image-clusterer
      dockerfile: Dockerfile
    # TODO: Better way to do this
    command: /bin/true
    profiles:
      - server-dev

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - palette-net
    profiles:
      - server-dev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - palette-net
    profiles:
      - server-dev

volumes:
  postgres_data:

networks:
  palette-net:
    driver: bridge