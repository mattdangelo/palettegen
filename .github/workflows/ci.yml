name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.0", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install libwebp (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      # Run the documented build scripts exactly as a developer would.
      - name: Build (bin/build)
        if: runner.os != 'Windows'
        run: bin/build
      - name: Build (bin/build.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bin/build.ps1

      - name: Test
        run: bundle exec rake test

      # Install the packaged .gem like a user would, then use it from outside the repo.
      - name: Install packaged gem and smoke test
        shell: bash
        run: |
          gem install --local pkg/palettegen-*.gem
          cd "$RUNNER_TEMP"
          ruby -e '
            require "palettegen"
            hex = Palettegen.hex(ARGV[0], colors: 3)
            abort "unexpected palette #{hex.inspect}" unless hex == ["#00ff00"]
            puts "palettegen #{Palettegen::VERSION}: #{hex.inspect}, webp=#{Palettegen.webp_supported?}"
          ' "$GITHUB_WORKSPACE/test/fixtures/green.png"

  # Coverage-guided fuzzing of the C++ decoder + clustering core with libFuzzer,
  # AddressSanitizer and UBSan. Runs without Ruby, which doesn't get on with ASan.
  fuzz:
    name: Fuzz (libFuzzer + ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ASan's shadow memory layout breaks with the 32-bit mmap randomisation
      # used by recent Ubuntu runner kernels.
      - name: Reduce ASLR entropy for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Two UBSan checks are off, both for harmless patterns in the vendored stb code:
      #   shift-base:        stb_image_write's JPEG encoder left-shifts negative values
      #                      (and it only ever encodes our own palette strips).
      #   nonnull-attribute: stb_image calls memcpy(NULL, src, 0) when a PNG's first
      #                      IDAT chunk is empty; zero bytes are copied.
      - name: Build fuzzer
        run: >
          clang++ -std=c++17 -g -O1
          -fsanitize=fuzzer,address,undefined -fno-sanitize=shift-base,nonnull-attribute
          -fno-sanitize-recover=undefined
          -Iext/palettegen -Iext/palettegen/vendor
          fuzz/fuzz_decode.cpp ext/palettegen/image_io.cpp ext/palettegen/kmeans.cpp
          -o fuzz_decode

      - name: Fuzz for 3 minutes
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p corpus
          cp test/fixtures/* corpus/
          ./fuzz_decode -max_total_time=180 -max_len=65536 -print_final_stats=1 corpus

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
